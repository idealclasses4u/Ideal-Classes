<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideal Classes by Adarsh Mishra</title>
<style>
body{margin:0;font-family:Arial;background:#081a33;color:#fff;text-align:center;padding-bottom:90px}
.header{background:linear-gradient(135deg,#d4af37,#fff1a8);color:#081a33;padding:28px 15px}
.header img{width:130px;height:130px;border-radius:50%;border:4px solid #081a33;object-fit:cover;object-position:top;background:#fff}
.header h1{margin:14px 0 8px;font-size:27px}
.badge{background:#081a33;color:#ffd700;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:bold;display:inline-block;margin-top:5px}
.box{background:#132f5c;margin:14px;padding:18px;border-radius:16px;border:1px solid #1f4a80;text-align:left}
.box h3{color:#ffd700;text-align:center;margin:0 0 12px}
.btn{display:block;background:#ffd700;color:#081a33;padding:14px;border-radius:30px;text-decoration:none;font-weight:bold;text-align:center;margin:10px 0}
.btn-green{background:#25D366;color:#fff}
input{width:92%;padding:14px;border-radius:30px;border:none;text-align:center;margin:10px 0;font-size:16px}
#resultBox{background:#081a33;padding:12px;border-radius:12px;display:none;border:1px solid #d4af37;margin-top:10px}
.wa-float{position:fixed;bottom:22px;right:22px;background:#25D366;color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;text-decoration:none;z-index:999999;box-shadow:0 5px 15px #000}
</style></head><body>
<div class="header">
<img src="IMG-20261008-WA0001.jpg">
<h1>Ideal Classes by Adarsh Mishra</h1>
<div class="badge">Both Offline and Online Class From 03:00 PM to 10:00 PM</div>
<p style="margin:10px 0 0;font-size:13px">Daily Live Class - 8 PM | CBSE 5th-12th</p>
</div>
<div class="box">
<h3>📚 Notes</h3>
<a class="btn" href="Xth%20CBSE%20Mathematics.docx">📥 Xth Maths Notes</a>
</div>
<div class="box">
<h3>📝 Attendance & Fees Check</h3>
<input id="searchInput" placeholder="Roll No / Name">
<a class="btn" onclick="searchStudent()" style="cursor:pointer;background:#fff">Check Now</a>
<div id="resultBox"></div>
<p id="loadStatus" style="text-align:center;font-size:11px;opacity:0.6">Loading sheet...</p>
</div>
<div class="box" style="text-align:center">
<h3>📞 Direct WhatsApp</h3>
<a class="btn-green btn" href="https://wa.me/917388262932">💬 Direct Chat - 7388262932</a>
</div>
<a class="wa-float" href="https://wa.me/917388262932">💬</a>
<script>
const SHEET_ID="1aYyjXlTsEHFeulaXciyx9REWIb8tnD-QjdbVhS4wZd0";
const URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
let DATA=[];
fetch(URL).then(r=>r.text()).then(t=>{
 if(t.startsWith("<")){document.getElementById("loadStatus").innerHTML="❌ Sheet Private - Anyone with link karo";return;}
 DATA=t.split("\n").map(r=>r.split(",").map(c=>c.replace(/"/g,"").trim()));
 document.getElementById("loadStatus").innerHTML="✅ "+(DATA.length-1)+" Students Loaded";
}).catch(()=>{document.getElementById("loadStatus").innerHTML="❌ Network Error"});
function searchStudent(){
 let q=document.getElementById("searchInput").value.toLowerCase().trim();
 let box=document.getElementById("resultBox"); box.style.display="block";
 if(!q){box.innerHTML="Name likho";return;}
 if(DATA.length==0){box.innerHTML="Sheet load ho rahi hai... 5 sec baad try karo";return;}
 let f=DATA.filter(r=>r.join(" ").toLowerCase().includes(q));
 if(f.length==0)box.innerHTML="❌ "+q+" nahi mila"; else{
  let h="✅ Mila:<br><br>"; f.slice(0,8).forEach(r=>h+=r.join(" | ")+"<br>---<br>"); box.innerHTML=h;
 }
}
</script></body></html>
