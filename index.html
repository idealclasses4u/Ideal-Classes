<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideal Classes by Adarsh Mishra</title>
<style>
body{margin:0;font-family:Arial;background:#081a33;color:#fff;text-align:center;padding-bottom:100px}
.header{background:linear-gradient(135deg,#d4af37,#fff1a8);color:#081a33;padding:28px 15px}
.header img{width:125px;height:125px;border-radius:50%;border:4px solid #081a33;object-fit:cover;object-position:top center;background:#fff}
.header h1{margin:14px 0 6px;font-size:26px;line-height:1.2}
.header .timing{background:#081a33;color:#ffd700;display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:bold;margin-top:8px}
.box{background:#132f5c;margin:14px;padding:18px;border-radius:16px;text-align:left;border:1px solid #1f4a80}
.box h3{color:#ffd700;margin:0 0 12px;text-align:center}
.btn{display:block;background:#ffd700;color:#081a33;padding:14px;border-radius:30px;text-decoration:none;font-weight:bold;text-align:center;margin:10px 0}
.btn-green{background:#25D366;color:#fff}
input{width:92%;padding:14px;border-radius:30px;border:none;text-align:center;font-size:16px;margin:10px 0}
#resultBox{background:#081a33;padding:14px;border-radius:12px;margin-top:10px;display:none;border:1px solid #d4af37;white-space:pre-wrap}
.float-wa{position:fixed;bottom:25px;right:25px;background:#25D366;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;
