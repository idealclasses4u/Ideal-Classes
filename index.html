<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideal Classes by Adarsh Mishra</title>
<style>
body{margin:0;font-family:Arial;background:#081a33;color:#fff;text-align:center;padding-bottom:90px}
.header{background:linear-gradient(135deg,#d4af37,#fff1a8);color:#081a33;padding:28px 15px}
.header img{width:135px;height:135px;border-radius:50%;border:4px solid #081a33;object-fit:cover;object-position:top;background:#fff}
.badge{background:#081a33;color:#ffd700;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:bold;display:inline-block;margin-top:8px}
.box{background:#132f5c;margin:14px;padding:18px;border-radius:16px;border:1px solid #1f4a80;text-align:left}
.box h3{color:#ffd700;text-align:center;margin:0 0 12px}
.mtabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.mtabs button{flex:1;padding:12px;border-radius:25px;border:none;font-weight:bold;background:#1f4a80;color:#fff}
.mtabs button.active{background:#ffd700;color:#081a33}
.stabs{display:flex;gap:6px;margin:8px 0}
.stabs button{flex:1;padding:8px;border-radius:15px;border:1px solid #ffd700;background:transparent;color:#ffd700;font-size:12px}
.stabs button.active{background:#ffd700;color:#081a33}
.file-list a{display:block;background:#0e2447;padding:11px;border-radius:10px;margin:6px 0;text-decoration:none;color:#fff;border-left:4px solid #ffd700;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
